<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Aylanto</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Premium Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="dashboard-container">
        
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="brand-section">
                <div class="logo-container">
                    <div class="logo-circle">
                        <span class="logo-a">A</span>
                        <i class="fa-solid fa-leaf logo-leaf"></i>
                    </div>
                </div>
                <div class="brand-text">
                    <h1>CAFE AYLANTO</h1>
                    <div class="brand-subtitle">
                        <span class="line"></span>
                        <p>PREMIUM COFFEE EXPERIENCE</p>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            
            <div class="datetime-section">
                <div class="datetime-item">
                    <div class="icon-circle">
                        <i class="fa-regular fa-calendar"></i>
                    </div>
                    <div class="datetime-text">
                        <span class="label">DATE</span>
                        <span class="value" id="current-date">29 July 2025</span>
                        <span class="sub-value" id="current-day">Tuesday</span>
                    </div>
                </div>
                <div class="datetime-divider"></div>
                <div class="datetime-item">
                    <div class="icon-circle">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div class="datetime-text">
                        <span class="label">TIME</span>
                        <span class="value" id="current-time">03:15 PM</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="welcome-section">
                <h2 class="welcome-cursive">Welcome to</h2>
                <h1 class="welcome-brand">CAFE AYLANTO</h1>
                <div class="welcome-subtitle">
                    <span class="line"></span>
                    <i class="fa-solid fa-gem diamond"></i>
                    <p>CHOOSE AN OPTION TO GET STARTED</p>
                    <span class="line"></span>
                </div>
            </div>

            <div class="cards-container">
                <!-- Card 1 -->
                <div class="card">
                    <div class="card-inner-border"></div>
                    <div class="card-content">
                        <div class="card-icon-wrapper">
                            <i class="fa-solid fa-mug-hot"></i>
                        </div>
                        <h3>NEW ORDER</h3>
                        <div class="card-divider">
                            <span class="line"></span>
                            <i class="fa-solid fa-gem diamond-small"></i>
                            <span class="line"></span>
                        </div>
                        <p>Create a new<br>customer order</p>
                    </div>
                    <div class="card-footer">
                        <div class="footer-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="card">
                    <div class="card-inner-border"></div>
                    <div class="card-content">
                        <div class="card-icon-wrapper">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                        <h3>EXISTING ORDERS</h3>
                        <div class="card-divider">
                            <span class="line"></span>
                            <i class="fa-solid fa-gem diamond-small"></i>
                            <span class="line"></span>
                        </div>
                        <p>View and manage<br>previous orders</p>
                    </div>
                    <div class="card-footer">
                        <div class="footer-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="card">
                    <div class="card-inner-border"></div>
                    <div class="card-content">
                        <div class="card-icon-wrapper">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h3>INVENTORY</h3>
                        <div class="card-divider">
                            <span class="line"></span>
                            <i class="fa-solid fa-gem diamond-small"></i>
                            <span class="line"></span>
                        </div>
                        <p>Manage stock and<br>inventory items</p>
                    </div>
                    <div class="card-footer">
                        <div class="footer-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Bar -->
        <footer class="bottom-bar">
            <div class="user-info">
                <div class="user-icon">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="user-text">
                    <span class="label">Logged in as</span>
                    <span class="value">Admin</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn">
                    <div class="btn-icon">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    SETTINGS
                </button>
                <div class="btn-divider"></div>
                <button class="action-btn">
                    <div class="btn-icon">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </div>
                    LOGOUT
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
